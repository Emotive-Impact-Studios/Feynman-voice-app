# Builds the iPhone app on GitHub's free macOS runners (the repo is public,
# so the minutes are free) and sends it to TestFlight. Same steps as an EAS
# cloud build, run with `eas build --local`, so it does not use Expo's
# monthly build allowance. Signing keys and the App Store Connect key come
# from the Expo account through EXPO_TOKEN.
#
# Run it from the Actions tab: "iOS to TestFlight" > Run workflow.
name: iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Send the build to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    environment: Build
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the Expo token is set
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN secret (expo.dev > Account settings > Access tokens) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      - name: Build (Xcode on this runner, signed with the Expo account's credentials)
        run: npx --yes eas-cli@latest build --profile production --platform ios --local --non-interactive --output "$RUNNER_TEMP/fenny.ipa"

      - name: Send to TestFlight
        if: ${{ inputs.submit }}
        run: npx --yes eas-cli@latest submit --profile production --platform ios --path "$RUNNER_TEMP/fenny.ipa" --non-interactive

      - name: Keep the app file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fenny-ios
          path: ${{ runner.temp }}/fenny.ipa
          if-no-files-found: ignore
          retention-days: 7
