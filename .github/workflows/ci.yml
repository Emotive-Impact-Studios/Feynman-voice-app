name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: NumPy for converting the voices file
        run: pip install numpy
      - name: Fetch Kitten TTS model (lets the real-model test run)
        run: ./scripts/fetch-kitten-model.sh models/kitten
      - run: npm run typecheck
      - run: npm test
